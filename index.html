<!--
  window.storage API는 그대로 유지하되, 내부 구현은 Firestore "REST API"를 일반 fetch()로 직접 호출하는 방식이야.
  (Firebase SDK의 실시간 스트리밍 채널이 학교 네트워크 방화벽에 막혀서 응답 없이 멈추는 문제가 있어,
  평범한 HTTPS 요청만 쓰는 REST 방식으로 바꿔서 방화벽 호환성을 높였어.)
  - shared=false(개인, 예: profile 로그인 세션)는 기기별 localStorage 그대로.
  - shared=true(계정/할일/시간표/성적/게시판 등)는 Firestore "examPlannerShared" 컬렉션에 저장.
-->
<script>
(function () {
  const PROJECT_ID = "planner-help";
  const API_KEY = "AIzaSyDPV3RlDIG5IKdgS6BIA54Aqe5is1HyOKQ";
  const BASE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;
  const SHARED_COLLECTION = "examPlannerShared";
  const LOCAL_PREFIX = "examPlannerStorage:personal:";

  // fetch에 타임아웃을 걸되, AbortController로 요청 자체를 취소해서 좀비 요청이 안 남게 함.
  async function fetchWithTimeout(url, options = {}, ms = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  function encodeFields(obj) {
    const fields = {};
    for (const k in obj) {
      const v = obj[k];
      if (typeof v === "number") fields[k] = { integerValue: String(Math.trunc(v)) };
      else fields[k] = { stringValue: String(v) };
    }
    return fields;
  }

  function decodeFields(fields) {
    const out = {};
    for (const k in fields || {}) {
      const f = fields[k];
      if (f.stringValue !== undefined) out[k] = f.stringValue;
      else if (f.integerValue !== undefined) out[k] = Number(f.integerValue);
      else if (f.doubleValue !== undefined) out[k] = f.doubleValue;
      else if (f.booleanValue !== undefined) out[k] = f.booleanValue;
      else out[k] = null;
    }
    return out;
  }

  window.storage = {
    async get(key, shared = false) {
      if (!shared) {
        try {
          const raw = localStorage.getItem(LOCAL_PREFIX + key);
          if (raw === null) return null;
          return { key, value: raw, shared: false };
        } catch (e) {
          return null;
        }
      }
      try {
        const res = await fetchWithTimeout(
          `${BASE_URL}/${SHARED_COLLECTION}/${encodeURIComponent(key)}?key=${API_KEY}`
        );
        if (res.status === 404) return null;
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const decoded = decodeFields(data.fields);
        return { key, value: decoded.value, shared: true };
      } catch (e) {
        console.error("storage.get 실패", key, e);
        return null;
      }
    },
    async set(key, value, shared = false) {
      if (!shared) {
        try {
          localStorage.setItem(LOCAL_PREFIX + key, value);
          return { key, value, shared: false };
        } catch (e) {
          return null;
        }
      }
      try {
        const body = { fields: encodeFields({ value, updatedAt: Date.now() }) };
        const res = await fetchWithTimeout(
          `${BASE_URL}/${SHARED_COLLECTION}/${encodeURIComponent(key)}?key=${API_KEY}`,
          {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          }
        );
        if (!res.ok) throw new Error("HTTP " + res.status);
        return { key, value, shared: true };
      } catch (e) {
        console.error("storage.set 실패", key, e);
        return null;
      }
    },
    async delete(key, shared = false) {
      if (!shared) {
        try {
          localStorage.removeItem(LOCAL_PREFIX + key);
          return { key, deleted: true, shared: false };
        } catch (e) {
          return null;
        }
      }
      try {
        const res = await fetchWithTimeout(
          `${BASE_URL}/${SHARED_COLLECTION}/${encodeURIComponent(key)}?key=${API_KEY}`,
          { method: "DELETE" }
        );
        if (!res.ok && res.status !== 404) throw new Error("HTTP " + res.status);
        return { key, deleted: true, shared: true };
      } catch (e) {
        console.error("storage.delete 실패", key, e);
        return null;
      }
    },
    async list(prefix = "", shared = false) {
      if (!shared) {
        try {
          const keys = [];
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith(LOCAL_PREFIX)) {
              const short = k.slice(LOCAL_PREFIX.length);
              if (!prefix || short.startsWith(prefix)) keys.push(short);
            }
          }
          return { keys, prefix, shared: false };
        } catch (e) {
          return { keys: [], prefix, shared: false };
        }
      }
      try {
        const keys = [];
        let pageToken = "";
        do {
          const url =
            `${BASE_URL}/${SHARED_COLLECTION}?key=${API_KEY}&pageSize=300` +
            (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "");
          const res = await fetchWithTimeout(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          (data.documents || []).forEach((d) => {
            const id = d.name.split("/").pop();
            if (!prefix || id.startsWith(prefix)) keys.push(id);
          });
          pageToken = data.nextPageToken || "";
        } while (pageToken);
        return { keys, prefix, shared: true };
      } catch (e) {
        console.error("storage.list 실패", prefix, e);
        return { keys: [], prefix, shared: true };
      }
    },
  };
})();
</script>

function mergeTimetableBlocks(slotsMap) {
  const blocks = [];
  let curText = null;
  let curStart = null;
  for (let i = 0; i < TIME_SLOTS.length; i++) {
    const text = slotsMap[TIME_SLOTS[i]] || null;
    if (text !== curText) {
      if (curText) blocks.push({ text: curText, startIdx: curStart, endIdx: i - 1 });
      curText = text;
      curStart = i;
    }
  }
  if (curText) blocks.push({ text: curText, startIdx: curStart, endIdx: TIME_SLOTS.length - 1 });
  return blocks;
}
function addHalfHour(hhmm) {
  let [h, m] = hhmm.split(":").map(Number);
  m += 30;
  if (m >= 60) { m -= 60; h = (h + 1) % 24; }
  return { h, m };
}
const to12h = (h) => { const r = h % 12; return r === 0 ? 12 : r; };
function formatTimetableRange(startIdx, endIdx) {
  const [sh, sm] = TIME_SLOTS[startIdx].split(":").map(Number);
  const end = addHalfHour(TIME_SLOTS[endIdx]);
  const s12 = to12h(sh), e12 = to12h(end.h);
  if (sm === 0 && end.m === 0) return `${s12}~${e12}시`;
  const sLabel = sm === 0 ? `${s12}시` : `${s12}시${sm}분`;
  const eLabel = end.m === 0 ? `${e12}시` : `${e12}시${end.m}분`;
  return `${sLabel}~${eLabel}`;
}

const withTask = (tasks, key, updater) => ({ ...tasks, [key]: updater(tasks[key] || []) });

function moveTaskAcross(tasks, setTasks, fromKey, toKey, id, beforeId) {
  if (fromKey === toKey && !beforeId) return;
  const fromList = tasks[fromKey] || [];
  const item = fromList.find((t) => t.id === id);
  if (!item) return;
  if (fromKey === toKey) {
    const list = fromList.filter((t) => t.id !== id);
    const idx = beforeId ? list.findIndex((t) => t.id === beforeId) : list.length;
    list.splice(idx < 0 ? list.length : idx, 0, item);
    setTasks({ ...tasks, [fromKey]: list });
    return;
  }
  const newFrom = fromList.filter((t) => t.id !== id);
  const toList = [...(tasks[toKey] || [])];
  const idx = beforeId ? toList.findIndex((t) => t.id === beforeId) : toList.length;
  toList.splice(idx < 0 ? toList.length : idx, 0, item);
  setTasks({ ...tasks, [fromKey]: newFrom, [toKey]: toList });
}

function useLocalState(key, initial, shared = false) {
  const [value, setValue] = useState(initial);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    let alive = true;
    setLoaded(false);
    (async () => {
      try {
        const r = await window.storage.get(key, shared);
        if (alive && r) setValue(JSON.parse(r.value));
        else if (alive) setValue(initial);
      } catch (e) {
        if (alive) setValue(initial);
      } finally {
        if (alive) setLoaded(true);
      }
    })();
    return () => { alive = false; };
  }, [key, shared]);
  const save = useCallback(async (next) => {
    setValue(next);
    try {
      const result = await window.storage.set(key, JSON.stringify(next), shared);
      if (!result) {
        console.error("저장 실패(응답 없음)", key);
        return false;
      }
      return true;
    } catch (e) {
      console.error("저장 실패", e);
      return false;
    }
  }, [key, shared]);
  return [value, save, loaded];
}

function ExamPlanner() {
  const [profile, setProfile] = useLocalState("profile", { name: "", studentId: "" });

  const [loginError, setLoginError] = useState("");

  const [serverLock, setServerLock, serverLockLoaded] = useLocalState("serverLock", { locked: false }, true);
  const toggleServerLock = (next) => setServerLock({ locked: next });

  // 데이터 초기화 - 학생별 공유 데이터(할일/시간표/과목/성적/명언픽)를 전부 지움
  const [resetBusy, setResetBusy] = useState(false);
  const [resetMsg, setResetMsg] = useState("");
  const resetAllStudentData = async () => {
    setResetBusy(true);
    setResetMsg("");
    try {
      const prefixes = ["tasks:", "subjects:", "timetable:", "scores:", "quotePick:"];
      for (const prefix of prefixes) {
        const listed = await window.storage.list(prefix, true);
        const keys = listed && listed.keys ? listed.keys : [];
        for (const k of keys) {
          try { await window.storage.delete(k, true); } catch (e) {}

    } catch (e) {
      setResetMsg("초기화 중 문제가 생겼어. 다시 시도해줘.");

  // 데일리 초기화 - "데일리" 탭에서 쓰는 학생별 오늘 할 일 + 시간표만 지움 (체크리스트·성적은 유지)
  const [resetDailyBusy, setResetDailyBusy] = useState(false);
  const [resetDailyMsg, setResetDailyMsg] = useState("");
  const resetDailyData = async () => {
    setResetDailyBusy(true);
    setResetDailyMsg("");
    try {
      const prefixes = ["tasks:", "timetable:"];
      for (const prefix of prefixes) {
        const listed = await window.storage.list(prefix, true);
        const keys = listed && listed.keys ? listed.keys : [];
        for (const k of keys) {
          try { await window.storage.delete(k, true); } catch (e) {}
        }
      }
      setResetDailyMsg("모든 학생의 오늘 할 일·시간표를 초기화했어. 새로고침하면 반영돼.");
    } catch (e) {
      setResetDailyMsg("초기화 중 문제가 생겼어. 다시 시도해줘.");
    }
    setResetDailyBusy(false);
  };

  // 게시판 초기화 - 게시판 글을 전부 지움
  const [resetBoardBusy, setResetBoardBusy] = useState(false);
  const [resetBoardMsg, setResetBoardMsg] = useState("");
  const resetBoardData = async () => {
    setResetBoardBusy(true);
    setResetBoardMsg("");
    try {
      const listed = await window.storage.list("board:", true);
      const keys = listed && listed.keys ? listed.keys : [];
      for (const k of keys) {
        try { await window.storage.delete(k, true); } catch (e) {}
      }
      setBoardPosts([]);
      setResetBoardMsg("게시판 글을 모두 지웠어.");
    } catch (e) {
      setResetBoardMsg("초기화 중 문제가 생겼어. 다시 시도해줘.");
    }
    setResetBoardBusy(false);
  };

  // 학생별 데이터는 학번을 키에 포함한 공유 저장소에 저장해서, 담임(10800)/부관리자(10816)의
  // 관리 페이지에서 날짜별 활동 통계를 볼 수 있게 함. (다른 학생 계정에서는 UI상 노출되지 않음)
  const dataOwner = profile.studentId || "_guest";
  const [subjects, setSubjects] = useLocalState(`subjects:${dataOwner}`, buildDefaultSubjects(), true);
  const [timetable, setTimetable] = useLocalState(`timetable:${dataOwner}`, {}, true);
  const [tasks, setTasks] = useLocalState(`tasks:${dataOwner}`, {}, true);
  const [scores, setScores] = useLocalState(`scores:${dataOwner}`, {}, true);
  const [notes, setNotes] = useLocalState(`notes:${dataOwner}`, [], true);

  // 시험범위 - 반 전체 공유, 지정된 학번만 수정 가능
  const [examScope, setExamScope] = useLocalState("examScope", {}, true);
  const [examTimetable, setExamTimetable] = useLocalState("examTimetable", {}, true);
  const canEditScope = SCOPE_EDITOR_IDS.has(profile.studentId);

  // 공부명언 뽑기 - 명언 목록은 전체 공유, 사용자가 처음 로그인할 때 뽑은 명언은 계정별로 보관
  const [quotes, setQuotes, quotesLoaded] = useLocalState("quotes", DEFAULT_QUOTES, true);
  const [myQuote, setMyQuote, myQuoteLoaded] = useLocalState(`quotePick:${dataOwner}`, { picked: false, text: "" }, true);
  const addQuote = (text) => setQuotes([...quotes, { id: uid(), text }]);
  const removeQuote = (id) => setQuotes(quotes.filter((q) => q.id !== id));
  const pickMyQuote = (text) => setMyQuote({ picked: true, text });

  const [focusMonth, setFocusMonth] = useState(() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; });

  const [classScores, setClassScores] = useState({});
  const [statsLoading, setStatsLoading] = useState(false);

  const loadClassScores = useCallback(async () => {
    setStatsLoading(true);
    try {
      const listed = await window.storage.list("scores:", true);
      const keys = listed && listed.keys ? listed.keys : [];
      const entries = {};
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r) {
            const sid = k.slice("scores:".length);
            entries[sid] = JSON.parse(r.value);
          }
        } catch (e) {}
      }
      setClassScores(entries);
    } catch (e) {
      setClassScores({});
    }
    setStatsLoading(false);
  }, []);

  // 학생 정보(계정/등록현황)는 10800(담임)·10816(부관리자) 둘 다 볼 수 있지만
  // 성적통계표는 10816(부관리자)만 볼 수 있고 10800(담임)은 볼 수 없어
  const canSeeStats = STATS_ACCESS_IDS.has(profile.studentId);
  const canSeeGrades = profile.studentId === VIEWER_ID;

  useEffect(() => {
    if (canSeeGrades) loadClassScores();
  }, [canSeeGrades, loadClassScores]);

  const [accounts, setAccounts] = useState({});
  const [accountsLoading, setAccountsLoading] = useState(false);
  const [accountsLoadError, setAccountsLoadError] = useState("");

  const loadAccounts = useCallback(async () => {
    setAccountsLoading(true);
    setAccountsLoadError("");
    try {
      const listed = await window.storage.list("account:", true);
      const keys = listed && listed.keys ? listed.keys : [];
      const entries = {};
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r) {
            const parsed = JSON.parse(r.value);
            entries[parsed.studentId] = parsed;
          }
        } catch (e) {}
      }
      setAccounts(entries);
    } catch (e) {
      setAccountsLoadError("목록을 불러오지 못했어. 새로고침 해봐.");
    }
    setAccountsLoading(false);
  }, []);

  useEffect(() => {
    if (canSeeStats) loadAccounts();
  }, [canSeeStats, loadAccounts]);

  // 날짜별 활동 로그(관리 페이지용) - 학생별 공유 저장소(tasks:학번)를 모두 읽어와 집계
  const [allTasks, setAllTasks] = useState({});
  const [tasksLoading, setTasksLoading] = useState(false);
  const loadAllTasks = useCallback(async () => {
    setTasksLoading(true);
    try {
      const listed = await window.storage.list("tasks:", true);
      const keys = listed && listed.keys ? listed.keys : [];
      const entries = {};
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r) {
            const sid = k.slice("tasks:".length);
            entries[sid] = JSON.parse(r.value);
          }
        } catch (e) {}
      }
      setAllTasks(entries);
    } catch (e) {
      setAllTasks({});
    }
    setTasksLoading(false);
  }, []);
  useEffect(() => {
    if (canSeeStats) loadAllTasks();
  }, [canSeeStats, loadAllTasks]);

  // 게시판 - 모든 학생이 보고 쓸 수 있는 공유 글타래
  const [boardPosts, setBoardPosts] = useState([]);
  const [boardLoading, setBoardLoading] = useState(false);
  const loadBoardPosts = useCallback(async () => {
    setBoardLoading(true);
    try {
      const listed = await window.storage.list("board:", true);
      const keys = listed && listed.keys ? listed.keys : [];
      const posts = [];
      for (const k of keys) {
        try {
          const r = await window.storage.get(k, true);
          if (r) posts.push(JSON.parse(r.value));
        } catch (e) {}
      }
      posts.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      setBoardPosts(posts);
    } catch (e) {
      setBoardPosts([]);
    }
    setBoardLoading(false);
  }, []);
  useEffect(() => {
    if (tab === "board" && profile.studentId) loadBoardPosts();
  }, [tab, profile.studentId, loadBoardPosts]);
  // 게시판이 켜져 있는 동안엔 새 글이 왔는지 주기적으로 다시 불러와서 채팅처럼 보이게 함
  useEffect(() => {
    if (tab !== "board" || !profile.studentId) return;
    const id = setInterval(loadBoardPosts, 8000);
    return () => clearInterval(id);
  }, [tab, profile.studentId, loadBoardPosts]);

  const addBoardPost = async (text, attachment) => {
    if (!text.trim() && !attachment) return false;
    const post = {
      id: uid(),
      studentId: profile.studentId,
      name: profile.name,
      text: text.trim(),
      attachment: attachment
        ? { kind: attachment.mimeType && attachment.mimeType.startsWith("image/") ? "image" : "file", dataUrl: attachment.dataUrl, name: attachment.name, mimeType: attachment.mimeType }
        : null,
      createdAt: Date.now(),
    };
    try {
      const result = await window.storage.set(`board:${post.id}`, JSON.stringify(post), true);
      if (!result) return false;
      setBoardPosts((prev) => [...prev, post]);
      return true;
    } catch (e) {
      return false;
    }
  };

  const getAccount = async (sid) => {
    try {
      const r = await window.storage.get(`account:${sid}`, true);
      return r ? JSON.parse(r.value) : null;
    } catch (e) {
      return null;
    }
  };

  const tryRegisterStep1 = async () => {
    const name = regDraft.name.trim();

    if (!name || !sid) {

      setRegError("지금은 서버가 잠겨 있어서 등록할 수 없어. 담임 선생님께 문의해줘.");
      return;
    }
    const listed = ROSTER[sid];
    if (!listed || listed !== name) {
      setRegError("저장된 정보가 없습니다. 이름과 학번을 다시 확인해줘.");
      return;
    }
    setBusy(true);
    const existing = await getAccount(sid);
    setBusy(false);
    if (existing) {
      setRegError("이미 등록된 학번이야. 로그인 화면에서 로그인해줘.");
      return;
    }
    setRegError("");
    setRegDraft({ name, studentId: sid });
    setScreen("register2");
  };

  const completeRegister = async () => {
    const { pw, pw2 } = pwDraft;
    if (!pw || pw.length < 4) {
      setPwError("비밀번호는 4자 이상으로 입력해줘.");
      return;
    }
    if (pw !== pw2) {
      setPwError("비밀번호가 서로 달라.");
      return;
    }
    setBusy(true);
    try {
      const payload = JSON.stringify({
        studentId: regDraft.studentId, name: regDraft.name, password: pw,
      });
      let result = await window.storage.set(`account:${regDraft.studentId}`, payload, true);
      if (!result) {
        // 조용히 실패(null 응답)하는 경우가 있어 한 번 더 시도해봄
        result = await window.storage.set(`account:${regDraft.studentId}`, payload, true);
      }
      if (!result) {
        setPwError("저장에 실패했어. 네트워크 상태를 확인하고 다시 시도해줘.");
        setBusy(false);
        return;
      }
      setPwError("");
      setProfile({ name: regDraft.name, studentId: regDraft.studentId });
    } catch (e) {
      setPwError("저장에 실패했어. 다시 시도해줘.");
    }
    setBusy(false);
  };

  const tryLogin = async () => {
    const sid = loginDraft.studentId.trim();
    const pw = loginDraft.password;
    if (!sid || !pw) {
      setLoginError("학번과 비밀번호를 모두 입력해줘.");
      return;
    }
    if (serverLock.locked && sid !== ADMIN_ID && sid !== VIEWER_ID) {
      setLoginError("지금은 서버가 잠겨 있어서 로그인할 수 없어. 담임 선생님께 문의해줘.");
      return;
    }
    setBusy(true);
    const account = await getAccount(sid);
    setBusy(false);
    if (!account) {
      setLoginError("등록된 계정이 없어. 먼저 등록해줘.");
      return;
    }
    if (account.password !== pw) {
      setLoginError("학번 또는 비밀번호가 틀렸어.");
      return;
    }
    setLoginError("");
    setProfile({ name: account.name, studentId: account.studentId });
  };

  const doLogout = () => {
    setProfile({ name: "", studentId: "" });
    setScreen("chooser");
    setLoginDraft({ studentId: "", password: "" });

    setPwDraft({ pw: "", pw2: "" });
    setTab("home");
  };

  const backToChooser = () => {
    setScreen("chooser");
    setRegError(""); setPwError(""); setLoginError("");
    setPwDraft({ pw: "", pw2: "" });
  };

  if (!profile.studentId) {
    return (
      <div style={pageStyle}>
        <GlobalStyle />
        <div style={{ maxWidth: 380, margin: "16vh auto", padding: "0 20px" }}>
          <div style={noteCardStyle}>

            {screen === "chooser" && (
              <>
                <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 6px" }}>시험 플래너</p>
                <h1 style={{ fontSize: 22, fontWeight: 800, color: "var(--ink)", margin: "0 0 20px" }}>로그인 또는 등록해줘</h1>
                {serverLock.locked && (
                  <p style={{ ...errorTextStyle, marginBottom: 14 }}>
                    ⚠ 지금은 서버가 잠겨 있어서 담임·부관리자 외 로그인·등록이 제한돼.
                  </p>
                )}
                <button style={{ ...primaryBtnStyle, width: "100%", marginBottom: 10 }} onClick={() => setScreen("login")}>
                  로그인
                </button>
                <button style={{ ...ghostBtnStyle, width: "100%", height: 38 }} onClick={() => setScreen("register1")}>
                  등록하기
                </button>
                <p style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 14 }}>
                  처음이면 등록하기로 학번을 확인하고 비밀번호를 만들어줘.
                </p>
              </>
            )}

            {screen === "login" && (
              <>
                <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 6px" }}>로그인</p>
                <h1 style={{ fontSize: 22, fontWeight: 800, color: "var(--ink)", margin: "0 0 16px" }}>학번과 비밀번호</h1>
                <label style={fieldLabelStyle}>학번</label>
                <input
                  value={loginDraft.studentId}
                  onChange={(e) => setLoginDraft({ ...loginDraft, studentId: e.target.value })}
                  placeholder="예: 10900"
                  style={{ ...inputStyle, marginBottom: 10 }}
                  onKeyDown={(e) => e.key === "Enter" && tryLogin()}
                />
                <label style={fieldLabelStyle}>비밀번호</label>
                <input
                  type="password"
                  value={loginDraft.password}
                  onChange={(e) => setLoginDraft({ ...loginDraft, password: e.target.value })}
                  placeholder="비밀번호"
                  style={inputStyle}
                  onKeyDown={(e) => e.key === "Enter" && tryLogin()}
                />
                {loginError && <p style={errorTextStyle}>{loginError}</p>}
                <button style={{ ...primaryBtnStyle, width: "100%", marginTop: 14 }} onClick={tryLogin} disabled={busy}>
                  {busy ? "확인 중..." : "로그인"}
                </button>
                <button style={{ ...ghostBtnStyle, width: "100%", height: 34, marginTop: 8 }} onClick={backToChooser}>
                  뒤로
                </button>
              </>
            )}

            {screen === "register1" && (
              <>
                <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 6px" }}>등록하기 · 1단계</p>
                <h1 style={{ fontSize: 22, fontWeight: 800, color: "var(--ink)", margin: "0 0 4px" }}>이름과 학번을 입력해줘</h1>
                <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 16px" }}>명단과 일치해야 다음 단계로 넘어가</p>
                <label style={fieldLabelStyle}>이름</label>
                <input
                  value={regDraft.name}
                  onChange={(e) => setRegDraft({ ...regDraft, name: e.target.value })}
                  placeholder="예: 홍길동"
                  style={{ ...inputStyle, marginBottom: 10 }}
                  onKeyDown={(e) => e.key === "Enter" && tryRegisterStep1()}
                />
                <label style={fieldLabelStyle}>학번</label>
                <input
                  value={regDraft.studentId}
                  onChange={(e) => setRegDraft({ ...regDraft, studentId: e.target.value })}
                  placeholder="예: 10900"
                  style={inputStyle}
                  onKeyDown={(e) => e.key === "Enter" && tryRegisterStep1()}
                />
                {regError && <p style={errorTextStyle}>{regError}</p>}
                <button style={{ ...primaryBtnStyle, width: "100%", marginTop: 14 }} onClick={tryRegisterStep1} disabled={busy}>
                  {busy ? "확인 중..." : "다음"}
                </button>
                <button style={{ ...ghostBtnStyle, width: "100%", height: 34, marginTop: 8 }} onClick={backToChooser}>
                  뒤로
                </button>
              </>

            {screen === "register2" && (
              <>
                <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 6px" }}>등록하기 · 2단계</p>
                <h1 style={{ fontSize: 22, fontWeight: 800, color: "var(--ink)", margin: "0 0 4px" }}>비밀번호를 만들어줘</h1>
                <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 16px" }}>{regDraft.name} · {regDraft.studentId}</p>
                <label style={fieldLabelStyle}>비밀번호</label>
                <input
                  type="password"
                  value={pwDraft.pw}
                  onChange={(e) => setPwDraft({ ...pwDraft, pw: e.target.value })}
                  placeholder="4자 이상"
                  style={{ ...inputStyle, marginBottom: 10 }}
                  onKeyDown={(e) => e.key === "Enter" && completeRegister()}
                />
                <label style={fieldLabelStyle}>비밀번호 확인</label>
                <input
                  type="password"
                  value={pwDraft.pw2}
                  onChange={(e) => setPwDraft({ ...pwDraft, pw2: e.target.value })}
                  placeholder="다시 입력"
                  style={inputStyle}
                  onKeyDown={(e) => e.key === "Enter" && completeRegister()}
                />
                {pwError && <p style={errorTextStyle}>{pwError}</p>}
                <button style={{ ...primaryBtnStyle, width: "100%", marginTop: 14 }} onClick={completeRegister} disabled={busy}>

        </div>
      </div>

  if (profile.studentId === ADMIN_ID) {

function DailyQuote({ quotesLoaded, quotes, myQuote, myQuoteLoaded, onPick }) {
  if (!myQuoteLoaded || !quotesLoaded) return null;
  if (myQuote.picked) {
    return (
      <div style={quoteBannerStyle}>
        <span style={{ fontWeight: 700, marginRight: 8 }}>오늘의 명언</span>
        <span>{myQuote.text}</span>
      </div>
    );
  }
  if (!quotes.length) return null;
  return <QuoteDrawOverlay quotes={quotes} onPick={onPick} />;
}

function QuoteDrawOverlay({ quotes, onPick }) {
  const [picks] = useState(() => {
    const pool = [...quotes];
    const chosen = [];
    const count = Math.min(5, pool.length);
    for (let i = 0; i < count; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      chosen.push(pool.splice(idx, 1)[0]);
    }
    return chosen;
  });
  const [revealedId, setRevealedId] = useState(null);
  const [confirmed, setConfirmed] = useState(false);

  const handleCardClick = (q) => {
    if (revealedId) return; // 이미 한 장을 골랐으면 다른 카드는 못 눌러
    setRevealedId(q.id);
  };

  const handleConfirm = () => {
    const chosen = picks.find((q) => q.id === revealedId);
    if (!chosen) return;
    setConfirmed(true);
    onPick(chosen.text);
  };

  return (
    <div style={quoteOverlayStyle}>
      <style>{quoteFlipCSS}</style>
      <div style={quoteModalStyle} className="quote-modal">
        <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: "0 0 4px" }}>공부명언 뽑기</p>
        <h2 style={{ fontSize: 18, fontWeight: 800, color: "var(--ink)", margin: "0 0 4px" }}>
          카드 5장 중 1장만 뒤집어서 골라줘
        </h2>
        <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 16px" }}>
          한 장을 뽑으면 나머지는 다시 선택할 수 없어.
        </p>
        <div style={quoteCardGridStyle} className="quote-card-grid">
          {picks.map((q) => {
            const isRevealed = revealedId === q.id;
            const isOther = !!revealedId && revealedId !== q.id;
            return (
              <div
                key={q.id}
                className={`quote-flip-card${isRevealed ? " is-flipped" : ""}${isOther ? " is-dimmed" : ""}`}
                onClick={() => handleCardClick(q)}
              >
                <div className="quote-flip-inner">
                  <div className="quote-flip-front">
                    <span className="quote-flip-front-icon">✦</span>
                    <span className="quote-flip-front-label">명언</span>
                  </div>
                  <div className="quote-flip-back">{q.text}</div>
                </div>
              </div>
            );
          })}
        </div>
        {revealedId && (
          <button
            style={{ ...primaryBtnStyle, width: "100%", marginTop: 16, opacity: confirmed ? 0.6 : 1 }}
            onClick={handleConfirm}
            disabled={confirmed}
          >
            {confirmed ? "선택 완료!" : "이 명언으로 선택할게"}
          </button>
        )}
      </div>
    </div>
  );
}

const quoteFlipCSS = `
  .quote-flip-card { perspective: 900px; cursor: pointer; height: 112px; }
  .quote-flip-card.is-dimmed { opacity: .3; pointer-events: none; }
  .quote-flip-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .55s cubic-bezier(.2,.8,.2,1);
    transform-style: preserve-3d;
  }
  .quote-flip-card.is-flipped .quote-flip-inner { transform: rotateY(180deg); }
  .quote-flip-front, .quote-flip-back {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    padding: 10px; text-align: center; box-sizing: border-box;
  }
  .quote-flip-front {

const EVENT_STYLE = {
  exam: { bg: "var(--marker)", border: "var(--marker)", label: "var(--ink)" },
  test: { bg: "#DCEAFE", border: "#8FB6EE", label: "#2E5FAE" },
  holiday: { bg: "#F1EFE8", border: "#D8D2C2", label: "var(--ink-soft)" },
};

function ExamCalendarView({ examDate }) {
  const initial = examDate ? new Date(examDate + "T00:00:00") : new Date();
  const [focus, setFocus] = useState({ year: initial.getFullYear(), month: initial.getMonth() });
  const { year, month } = focus;

  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay() + 6) % 7;
  const numDays = daysInMonth(year, month);
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= numDays; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const todayKey = toKey(new Date());
  const dayKeyFor = (d) => `${year}-${pad2(month + 1)}-${pad2(d)}`;
  const eventByDate = Object.fromEntries(SCHOOL_EVENTS.map((e) => [e.date, e]));

  const prevMonth = () => setFocus(month === 0 ? { year: year - 1, month: 11 } : { year, month: month - 1 });
  const nextMonth = () => setFocus(month === 11 ? { year: year + 1, month: 0 } : { year, month: month + 1 });

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <button style={ghostBtnStyle} onClick={prevMonth}>‹</button>
        <span style={{ fontSize: 13, fontWeight: 700, color: "var(--ink)" }}>{year}년 {month + 1}월</span>
        <button style={ghostBtnStyle} onClick={nextMonth}>›</button>
      </div>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
        <LegendDot color={EVENT_STYLE.exam.bg} label="시험" />
        <LegendDot color={EVENT_STYLE.test.bg} label="모의고사·듣기평가" />
        <LegendDot color={EVENT_STYLE.holiday.bg} label="휴일·연휴" />
      </div>
      <div style={{ overflowX: "auto" }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, minWidth: 320 }}>
          {WEEKDAY_KO.map((w) => (
            <div key={w} style={{ fontSize: 11, color: "var(--ink-soft)", fontWeight: 600, textAlign: "center", padding: "2px 0" }}>{w}</div>
          ))}
          {cells.map((d, i) => {
            if (d == null) return <div key={`b${i}`} />;
            const key = dayKeyFor(d);
            const isToday = key === todayKey;
            const isDday = key === examDate;
            const inExamRange = isInExamRange(key);
            const event = eventByDate[key];
            const kind = inExamRange ? "exam" : event ? event.kind : null;
            const style = kind ? EVENT_STYLE[kind] : null;
            return (
              <div
                key={key}
                style={{
                  ...monthCellStyle,
                  minHeight: 52,
                  ...(isToday ? monthCellTodayStyle : {}),
                  ...(style ? { background: style.bg, borderColor: style.border } : {}),
                  ...(isDday ? { boxShadow: "0 0 0 2px var(--ink) inset" } : {}),
                }}
              >
                <span style={{ fontSize: 12, fontWeight: isDday || isToday ? 800 : 600, color: isToday ? "var(--teal)" : "var(--ink)" }}>
                  {d}
                </span>
                {isDday && <p style={{ fontSize: 9, margin: "2px 0 0", fontWeight: 700, color: "var(--ink)" }}>D-day</p>}
                {!isDday && (inExamRange || event) && (
                  <p style={{ fontSize: 9, margin: "2px 0 0", fontWeight: 700, color: style.label, lineHeight: 1.3 }}>
                    {inExamRange ? "시험" : event.label}
                  </p>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function DailyHubTab({ tasks, setTasks, subjects, setSubjects, timetable, setTimetable }) {
  const [dateKey, setDateKey] = useState(() => toKey(new Date()));
  const [dragPayload, setDragPayload] = useState(null); // { text }
  const dateObj = new Date(dateKey + "T00:00:00");
  const dateLabel = `${dateObj.getFullYear()}.${pad2(dateObj.getMonth() + 1)}.${pad2(dateObj.getDate())} (${WEEKDAY_KO[(dateObj.getDay() + 6) % 7]})`;

  const clearDrag = () => setDragPayload(null);

  const fillRange = (startIdx, endIdx, text) => {
    if (!text) return;
    const lo = Math.min(startIdx, endIdx);
    const hi = Math.max(startIdx, endIdx);
    const daySlots = { ...(timetable[dateKey] || {}) };
    for (let i = lo; i <= hi; i++) daySlots[TIME_SLOTS[i]] = text;
    setTimetable({ ...timetable, [dateKey]: daySlots });
  };

  const setSlotText = (slotKey, text) => {
    const daySlots = { ...(timetable[dateKey] || {}) };
    if (text && text.trim()) daySlots[slotKey] = text.trim();
    else delete daySlots[slotKey];
    setTimetable({ ...timetable, [dateKey]: daySlots });
  };

  const clearSlot = (slotKey) => {
    const daySlots = { ...(timetable[dateKey] || {}) };
    delete daySlots[slotKey];
    setTimetable({ ...timetable, [dateKey]: daySlots });
  };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={ghostBtnStyle} onClick={() => setDateKey(toKey(addDays(dateObj, -1)))}>‹ 어제</button>
          <button style={ghostBtnStyle} onClick={() => setDateKey(toKey(new Date()))}>오늘</button>
          <button style={ghostBtnStyle} onClick={() => setDateKey(toKey(addDays(dateObj, 1)))}>내일 ›</button>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: "var(--ink)" }}>{dateLabel}</span>
          <input
            type="date"
            value={dateKey}
            onChange={(e) => e.target.value && setDateKey(e.target.value)}
            style={{ ...inputStyle, width: 150, height: 34 }}
          />
        </div>
      </div>

      <div style={{ display: "flex", gap: 16, alignItems: "flex-start", flexWrap: "wrap" }} className="daily-columns">
        <div style={{ flex: "1 1 320px", minWidth: 280 }}>
          <TodoPanel
            tasks={tasks}
            setTasks={setTasks}
            dateKey={dateKey}
            onTextDragStart={(text) => setDragPayload({ text, originIndex: null })}
            onTextDragEnd={clearDrag}
          />
          <ChecklistPanel
            subjects={subjects}
            setSubjects={setSubjects}
            onTextDragStart={(text) => setDragPayload({ text, originIndex: null })}
            onTextDragEnd={clearDrag}
          />
        </div>
        <div style={{ flex: "1 1 300px", minWidth: 260 }}>
          <HourlyTimetablePanel
            slots={timetable[dateKey] || {}}
            dragPayload={dragPayload}
            onFillRange={fillRange}
            onSetSlotText={setSlotText}
            onClearSlot={clearSlot}
            onDropDone={clearDrag}
            onCellDragStart={(idx, text) => setDragPayload({ text, originIndex: idx })}
            onCellDragEnd={clearDrag}
          />
        </div>
      </div>
    </div>
  );
}

function TodoPanel({ tasks, setTasks, dateKey, onTextDragStart, onTextDragEnd }) {
  const [draft, setDraft] = useState("");
  const list = tasks[dateKey] || [];
  const achieved = list.filter((t) => t.status === "달성").length;

  const add = () => {
    if (!draft.trim()) return;
    setTasks(withTask(tasks, dateKey, (l) => [...l, { id: uid(), text: draft.trim(), status: DEFAULT_TASK_STATUS }]));
    setDraft("");
  };
  const setStatus = (id, status) => setTasks(withTask(tasks, dateKey, (l) => l.map((t) => (t.id === id ? { ...t, status } : t))));
  const remove = (id) => setTasks(withTask(tasks, dateKey, (l) => l.filter((t) => t.id !== id)));
  const onDropOnList = (e) => {
    e.preventDefault();
    const data = dragTaskData(e);
    if (!data) return;
    moveTaskAcross(tasks, setTasks, data.dateKey, dateKey, data.id);
  };
  const onDropOnRow = (e, beforeId) => {
    const data = dragTaskData(e);
    if (!data) return;
    moveTaskAcross(tasks, setTasks, data.dateKey, dateKey, data.id, beforeId);
  };

  return (
    <SectionCard title="오늘 할 일" subtitle={`달성 ${achieved} / 전체 ${list.length} · 오른쪽 시간표로 끌어다 놓아봐`}>
      <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
        <input
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && add()}
          placeholder="할 일 추가"
          style={{ ...inputStyle, flex: 1 }}
        />
        <button style={primaryBtnStyle} onClick={add}>추가</button>
      </div>
      <ul
        style={{ margin: 0, padding: 0, listStyle: "none", minHeight: 24 }}
        onDragOver={(e) => e.preventDefault()}
        onDrop={onDropOnList}
      >
        {list.length === 0 && <EmptyHint text="할 일을 추가해봐. 다른 날짜의 할 일을 여기로 끌어놓을 수도 있어." />}
        {list.map((t) => (
          <TaskRow
            key={t.id}
            task={t}
            dateKey={dateKey}
            onStatusChange={(status) => setStatus(t.id, status)}
            onDelete={() => remove(t.id)}
            onDropOnTask={(e, beforeId) => onDropOnRow(e, beforeId)}
            onTextDragStart={onTextDragStart}
            onTextDragEnd={onTextDragEnd}
          />
        ))}
      </ul>
    </SectionCard>
  );
}

  const [newSubject, setNewSubject] = useState("");
  const [newTopic, setNewTopic] = useState({});

  const addSubject = () => {
    if (!newSubject.trim()) return;
    setSubjects([...subjects, { id: uid(), name: newSubject.trim(), topics: [] }]);
    setNewSubject("");
  };
  const removeSubject = (id) => setSubjects(subjects.filter((s) => s.id !== id));
  const addTopic = (sid) => {
    const text = (newTopic[sid] || "").trim();

    setSubjects(subjects.map((s) => s.id === sid ? { ...s, topics: [...s.topics, { id: uid(), text, status: DEFAULT_TASK_STATUS }] } : s));
    setNewTopic({ ...newTopic, [sid]: "" });

  const cycleTopicStatus = (sid, tid) => {
    setSubjects(subjects.map((s) => s.id !== sid ? s : {
      ...s, topics: s.topics.map((t) => t.id === tid ? { ...t, status: nextTaskStatus(t.status || DEFAULT_TASK_STATUS) } : t)

    setSubjects(subjects.map((s) => s.id !== sid ? s : { ...s, topics: s.topics.filter((t) => t.id !== tid) }));

function HourlyTimetablePanel({ slots, dragPayload, onFillRange, onSetSlotText, onClearSlot, onDropDone, onCellDragStart, onCellDragEnd }) {
  const [hover, setHover] = useState(null);
  const [editingKey, setEditingKey] = useState(null);
  const [editDraft, setEditDraft] = useState("");

  useEffect(() => {
    if (!dragPayload) setHover(null);
  }, [dragPayload]);

  const openCell = (key) => {
    setEditingKey(key);
    setEditDraft(slots[key] || "");
  };
  const saveCell = () => {
    onSetSlotText(editingKey, editDraft);
    setEditingKey(null);
  };

  const isExtending = !!dragPayload && dragPayload.originIndex != null;
  const rangeLo = isExtending && hover !== null ? Math.min(dragPayload.originIndex, hover) : hover;
  const rangeHi = isExtending && hover !== null ? Math.max(dragPayload.originIndex, hover) : hover;

  const handleDrop = (idx) => (e) => {
    e.preventDefault();
    if (dragPayload && dragPayload.text) {
      if (dragPayload.originIndex != null) {
        // 이미 놓여있던 칸을 드래그해서 확장하는 경우 - 시작 칸부터 놓은 칸까지 채움
        onFillRange(dragPayload.originIndex, idx, dragPayload.text);
      } else {
        // 할 일/체크리스트에서 처음 끌어온 경우 - 놓은 칸 한 곳만 채움
        onSetSlotText(TIME_SLOTS[idx], dragPayload.text);
      }
    }
    setHover(null);
    onDropDone && onDropDone();
  };

  return (
    <SectionCard title="시간표" subtitle="아침 6시 ~ 다음날 새벽 6시 · 먼저 한 칸에 놓고, 놓인 칸을 드래그하면 구간을 채울 수 있어">
      <div style={hourlyScrollStyle}>
        {TIME_SLOTS.map((key, idx) => {
          const isHour = key.endsWith(":00");
          const filled = slots[key];
          const isEditing = editingKey === key;
          const inRange = rangeLo !== null && hover !== null && idx >= rangeLo && idx <= rangeHi;
          return (
            <div
              key={key}
              draggable={!!filled}
              onDragStart={(e) => {
                if (!filled) return;
                e.dataTransfer.setData("text/plain", filled);
                onCellDragStart && onCellDragStart(idx, filled);
              }}
              onDragEnd={() => onCellDragEnd && onCellDragEnd()}
              style={{
                ...hourlyRowStyle,
                ...(isHour ? hourlyRowHourStyle : {}),
                ...(filled ? { cursor: "grab" } : {}),
                ...(inRange ? hourlyRowDragOverStyle : {}),
              }}
              onDragOver={(e) => e.preventDefault()}
              onDragEnter={() => {
                if (!dragPayload) return;
                setHover(idx);
              }}
              onDrop={handleDrop(idx)}
              onClick={() => !isEditing && !dragPayload && openCell(key)}
            >
              <span style={{ ...hourlyLabelStyle, fontWeight: isHour ? 700 : 400 }}>{isHour ? key : ""}</span>
              {filled && !isEditing && <span style={dragHandleStyle} aria-hidden="true">⠿</span>}
              {isEditing ? (
                <input
                  autoFocus
                  value={editDraft}
                  onChange={(e) => setEditDraft(e.target.value)}
                  onBlur={saveCell}
                  onKeyDown={(e) => e.key === "Enter" && saveCell()}
                  style={ttInputStyle}
                />
              ) : (
                <span style={{ flex: 1, fontSize: 12, color: filled ? "var(--ink)" : "var(--grid)", fontWeight: filled ? 600 : 400 }}>
                  {filled || "+"}
                </span>
              )}
              {filled && !isEditing && (
                <button
                  style={{ ...xBtnStyle, padding: "0 4px" }}
                  onClick={(e) => { e.stopPropagation(); onClearSlot(key); }}
                  aria-label="삭제"
                >
                  ✕
                </button>
              )}
            </div>
          );
        })}
      </div>
    </SectionCard>
  );
}

function TaskRow({ task, dateKey, onStatusChange, onDelete, onDropOnTask, onTextDragStart, onTextDragEnd }) {
  const status = TASK_STATUS_MAP[task.status] || TASK_STATUS_MAP[DEFAULT_TASK_STATUS];
  return (

      draggable
      onDragStart={(e) => {
        e.dataTransfer.setData("text/plain", JSON.stringify({ id: task.id, dateKey }));
        onTextDragStart && onTextDragStart(task.text);
      }}
      onDragEnd={() => onTextDragEnd && onTextDragEnd()}
      onDragOver={(e) => e.preventDefault()}
      onDrop={(e) => { e.preventDefault(); e.stopPropagation(); onDropOnTask && onDropOnTask(e, task.id); }}
      style={taskRowStyle}
    >
      <span style={dragHandleStyle} aria-hidden="true">⠿</span>
      <span style={{
        fontSize: 13, flex: 1, minWidth: 0,
        textDecoration: task.status === "달성" || task.status === "실패" ? "line-through" : "none",
        color: task.status === "실패" ? "var(--coral)" : "var(--ink)",

      }}>
        {task.text}
      </span>
      <button

        style={{ ...statusButtonStyle, color: status.color, background: status.bg }}
        title="클릭하면 다음 상태로 바뀌어"
      >
        {status.key}
      </button>
      <button style={xBtnStyle} onClick={onDelete} aria-label="삭제">✕</button>

  );
}

function WeeklyTab({ tasks, setTasks }) {
  const [offset, setOffset] = useState(0);
  const [drafts, setDrafts] = useState({});
  const base = addDays(startOfWeek(new Date()), offset * 7);
  const weekDates = Array.from({ length: 7 }, (_, i) => addDays(base, i));
  const todayKey = toKey(new Date());

  const addTask = (key) => {
    const text = (drafts[key] || "").trim();
    if (!text) return;
    setTasks(withTask(tasks, key, (list) => [...list, { id: uid(), text, status: DEFAULT_TASK_STATUS }]));
    setDrafts({ ...drafts, [key]: "" });
  };
  const setStatus = (key, id, status) => setTasks(withTask(tasks, key, (list) => list.map((t) => (t.id === id ? { ...t, status } : t))));
  const remove = (key, id) => setTasks(withTask(tasks, key, (list) => list.filter((t) => t.id !== id)));

  const onDropToColumn = (e, key) => {
    e.preventDefault();
    const data = dragTaskData(e);
    if (!data) return;
    moveTaskAcross(tasks, setTasks, data.dateKey, key, data.id);
  };
  const onDropOnRow = (e, key, beforeId) => {
    const data = dragTaskData(e);
    if (!data) return;
    moveTaskAcross(tasks, setTasks, data.dateKey, key, data.id, beforeId);
  };

  const rangeLabel = `${weekDates[0].getMonth() + 1}.${weekDates[0].getDate()} - ${weekDates[6].getMonth() + 1}.${weekDates[6].getDate()}`;

  return (
    <SectionCard title="위클리" subtitle={rangeLabel}>

        <button style={ghostBtnStyle} onClick={() => setOffset(0)}>이번주</button>
        <button style={ghostBtnStyle} onClick={() => setOffset(offset + 1)}>다음주 ›</button>
      </div>
      <div style={{ overflowX: "auto" }}>
        <div className="week-cols" style={{ display: "flex", gap: 8, minWidth: 700 }}>
          {weekDates.map((d, i) => {
            const key = toKey(d);
            const isToday = key === todayKey;
            const list = tasks[key] || [];
            return (
              <div
                key={key}
                style={{ ...weekColStyle, ...(isToday ? weekColTodayStyle : {}) }}
                onDragOver={(e) => e.preventDefault()}
                onDrop={(e) => onDropToColumn(e, key)}
              >
                <p style={{ fontSize: 12, fontWeight: 700, color: isToday ? "var(--teal)" : "var(--ink)", margin: "0 0 2px" }}>
                  {WEEKDAY_KO[i]}

                <ul style={{ margin: 0, padding: 0, listStyle: "none", minHeight: 20 }}>
                  {list.map((t) => (
                    <TaskRow
                      key={t.id}
                      task={t}
                      dateKey={key}
                      onStatusChange={(status) => setStatus(key, t.id, status)}
                      onDelete={() => remove(key, t.id)}
                      onDropOnTask={(e, beforeId) => onDropOnRow(e, key, beforeId)}
                    />
                  ))}
                </ul>
                <div style={{ marginTop: 8 }}>
                  <input
                    value={drafts[key] || ""}
                    onChange={(e) => setDrafts({ ...drafts, [key]: e.target.value })}
                    onKeyDown={(e) => e.key === "Enter" && addTask(key)}
                    placeholder="+ 할 일"
                    style={weekInputStyle}
                  />
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </SectionCard>
  );
}

function MonthlyTab({ tasks, setTasks, focusMonth, setFocusMonth }) {
  const { year, month } = focusMonth;
  const [selected, setSelected] = useState(null);
  const [draft, setDraft] = useState("");

  const first = new Date(year, month, 1);
  const startWeekday = (first.getDay() + 6) % 7;
  const numDays = daysInMonth(year, month);
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= numDays; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const todayKey = toKey(new Date());
  const dayKeyFor = (d) => `${year}-${pad2(month + 1)}-${pad2(d)}`;
  const selectedKey = selected != null ? dayKeyFor(selected) : null;
  const selectedList = selectedKey ? (tasks[selectedKey] || []) : [];

  const prevMonth = () => {
    setSelected(null);
    if (month === 0) setFocusMonth({ year: year - 1, month: 11 });
    else setFocusMonth({ year, month: month - 1 });
  };
  const nextMonth = () => {
    setSelected(null);
    if (month === 11) setFocusMonth({ year: year + 1, month: 0 });
    else setFocusMonth({ year, month: month + 1 });
  };
  const goThisMonth = () => {
    const d = new Date();
    setFocusMonth({ year: d.getFullYear(), month: d.getMonth() });
    setSelected(d.getDate());
  };

  const onDropToDay = (e, d) => {
    e.preventDefault();
    const data = dragTaskData(e);
    if (!data) return;
    moveTaskAcross(tasks, setTasks, data.dateKey, dayKeyFor(d), data.id);
  };
  const onDropOnRow = (e, beforeId) => {
    const data = dragTaskData(e);
    if (!data || !selectedKey) return;
    moveTaskAcross(tasks, setTasks, data.dateKey, selectedKey, data.id, beforeId);
  };
  const setStatus = (id, status) => setTasks(withTask(tasks, selectedKey, (l) => l.map((t) => (t.id === id ? { ...t, status } : t))));
  const remove = (id) => setTasks(withTask(tasks, selectedKey, (l) => l.filter((t) => t.id !== id)));
  const add = () => {
    if (!draft.trim() || !selectedKey) return;
    setTasks(withTask(tasks, selectedKey, (l) => [...l, { id: uid(), text: draft.trim(), status: DEFAULT_TASK_STATUS }]));
    setDraft("");
  };

  return (
    <div>
      <SectionCard title="먼슬리" subtitle={`${year}년 ${month + 1}월`}>
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 12 }}>
          <button style={ghostBtnStyle} onClick={prevMonth}>‹ 이전달</button>
          <button style={ghostBtnStyle} onClick={goThisMonth}>이번달</button>
          <button style={ghostBtnStyle} onClick={nextMonth}>다음달 ›</button>
        </div>
        <div style={{ overflowX: "auto" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, minWidth: 560 }}>
            {WEEKDAY_KO.map((w) => (
              <div key={w} style={{ fontSize: 11, color: "var(--ink-soft)", fontWeight: 600, textAlign: "center", padding: "2px 0" }}>{w}</div>
            ))}
            {cells.map((d, i) => {
              if (d == null) return <div key={`b${i}`} />;
              const key = dayKeyFor(d);
              const list = tasks[key] || [];
              const isToday = key === todayKey;
              const isSelected = d === selected;
              return (
                <div
                  key={key}
                  onClick={() => setSelected(d)}
                  onDragOver={(e) => e.preventDefault()}
                  onDrop={(e) => onDropToDay(e, d)}
                  style={{ ...monthCellStyle, ...(isToday ? monthCellTodayStyle : {}), ...(isSelected ? monthCellSelectedStyle : {}) }}
                >
                  <span style={{ fontSize: 11, fontWeight: isToday ? 800 : 600, color: isToday ? "var(--teal)" : "var(--ink)" }}>{d}</span>
                  {list.slice(0, 2).map((t) => (
                    <p key={t.id} style={{
                      fontSize: 10, margin: "2px 0 0",
                      color: (TASK_STATUS_MAP[t.status] || TASK_STATUS_MAP[DEFAULT_TASK_STATUS]).color,
                      textDecoration: t.status === "달성" || t.status === "실패" ? "line-through" : "none",
                      whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                    }}>
                      {t.text}
                    </p>
                  ))}
                  {list.length > 2 && <p style={{ fontSize: 10, margin: "2px 0 0", color: "var(--ink-soft)" }}>+{list.length - 2}</p>}
                </div>
              );
            })}
          </div>
        </div>
      </SectionCard>

      {selectedKey && (
        <SectionCard title={`${month + 1}월 ${selected}일 할 일`}>
          <ul
            style={{ margin: 0, padding: 0, listStyle: "none", minHeight: 24 }}
            onDragOver={(e) => e.preventDefault()}
            onDrop={(e) => { e.preventDefault(); const data = dragTaskData(e); if (data) moveTaskAcross(tasks, setTasks, data.dateKey, selectedKey, data.id); }}
          >
            {selectedList.length === 0 && <EmptyHint text="이 날짜에 할 일이 없어. 추가하거나 다른 날짜에서 끌어와봐." />}
            {selectedList.map((t) => (
              <TaskRow
                key={t.id}
                task={t}
                dateKey={selectedKey}
                onStatusChange={(status) => setStatus(t.id, status)}
                onDelete={() => remove(t.id)}
                onDropOnTask={(e, beforeId) => onDropOnRow(e, beforeId)}
              />
            ))}
          </ul>
          <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
            <input value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="할 일 추가" style={{ ...inputStyle, flex: 1 }} />
            <button style={primaryBtnStyle} onClick={add}>추가</button>
          </div>
        </SectionCard>
      )}
    </div>
  );
}

function GradesTab({ scores, setScores }) {
  const [roundKey, setRoundKey] = useState(DEFAULT_ROUND_KEY);
  const [draft, setDraft] = useState({}); // { subject: { actual, target } }
  const [saved, setSaved] = useState(false);
  const round = EXAM_ROUNDS.find((r) => r.key === roundKey);
  const roundScores = scores[roundKey] || {};

  useEffect(() => {
    const next = {};
    round.subjects.forEach((s) => {
      next[s] = {
        actual: roundScores[s]?.actual ?? "",
        target: roundScores[s]?.target ?? "",
      };
    });
    setDraft(next);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [roundKey, scores]);

  const [saveError, setSaveError] = useState("");
  const persist = async (nextDraft) => {
    const cleanRound = {};
    round.subjects.forEach((s) => {
      const a = Number(nextDraft[s]?.actual);
      const t = Number(nextDraft[s]?.target);
      cleanRound[s] = {
        ...(nextDraft[s]?.actual !== "" && !isNaN(a) ? { actual: a } : {}),
        ...(nextDraft[s]?.target !== "" && !isNaN(t) ? { target: t } : {}),
      };
    });
    const ok = await setScores({ ...scores, [roundKey]: cleanRound });
    if (ok === false) {
      setSaveError("저장에 실패했어. 다시 입력해줘.");
      return;
    }
    setSaveError("");
    setSaved(true);
    setTimeout(() => setSaved(false), 900);
  };

  const setField = (subj, field, value) => {
    const next = { ...draft, [subj]: { ...draft[subj], [field]: value } };
    setDraft(next);
    persist(next);
  };

  const chartData = round.subjects.map((s) => ({
    subject: s,
    내점수: Number(draft[s]?.actual) || 0,
    목표: Number(draft[s]?.target) || 0,
  }));

  return (
    <div>
      <nav style={{ ...tabBarStyle, marginBottom: 14 }}>
        {EXAM_ROUNDS.map((r) => (
          <button key={r.key} onClick={() => setRoundKey(r.key)} style={{ ...tabBtnStyle, ...(roundKey === r.key ? tabBtnActiveStyle : {}) }}>
            {r.label}
          </button>
        ))}
      </nav>

      <SectionCard title={`${round.label} 성적 입력`} subtitle="입력하면 바로 저장돼 · 내 점수는 나만 볼 수 있어">
        {round.subjects.map((s) => {
          const a = draft[s]?.actual;
          const t = draft[s]?.target;
          const diff = a !== "" && t !== "" && !isNaN(Number(a)) && !isNaN(Number(t)) ? Number(a) - Number(t) : null;
          return (
            <div key={s} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8, flexWrap: "wrap" }}>
              <span style={{ width: 56, fontSize: 13, color: "var(--ink)", fontWeight: 600 }}>{s}</span>
              <input
                type="number" min="0" max="100" placeholder="내 점수"
                value={a ?? ""}
                onChange={(e) => setField(s, "actual", e.target.value)}
                style={{ ...inputStyle, width: 90, height: 32 }}
              />
              <input
                type="number" min="0" max="100" placeholder="목표 점수"
                value={t ?? ""}
                onChange={(e) => setField(s, "target", e.target.value)}
                style={{ ...inputStyle, width: 90, height: 32 }}
              />
              {diff != null && (
                <span style={{ fontSize: 12, fontWeight: 700, color: diff >= 0 ? "var(--teal)" : "var(--coral)" }}>
                  {diff >= 0 ? `목표 +${diff}` : `목표 ${diff}`}
                </span>
              )}
            </div>
          );
        })}
        <p style={{ fontSize: 12, color: saveError ? "var(--coral)" : saved ? "var(--teal)" : "var(--ink-soft)", margin: "10px 0 0", fontWeight: 600, transition: "color .3s" }}>
          {saveError || (saved ? "저장됨" : "\u00A0")}
        </p>
      </SectionCard>

      <SectionCard title="내 점수 vs 목표 점수">
        <div style={{ height: 220 }}>
          <ResponsiveContainer width="100%" height="100%">
            <BarChart data={chartData} margin={{ top: 8, right: 8, left: -20, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#D7DFEA" />
              <XAxis dataKey="subject" tick={{ fontSize: 12, fill: "#55617A" }} />
              <YAxis tick={{ fontSize: 12, fill: "#55617A" }} domain={[0, 100]} />
              <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: "1px solid #D7DFEA" }} />
              <Bar dataKey="내점수" fill="#FFC145" radius={[4, 4, 0, 0]} />
              <Bar dataKey="목표" fill="#1E8F76" radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        </div>
      </SectionCard>
    </div>
  );
}

const MAX_BOARD_FILE_BYTES = 3.5 * 1024 * 1024; // 3.5MB (저장소 한 칸당 5MB 제한 + base64 인코딩 오버헤드 감안한 안전 최대치)

function BoardTab({ posts, loading, onReload, onPost, myStudentId }) {
  const [text, setText] = useState("");
  const [pendingFile, setPendingFile] = useState(null); // { dataUrl, name, mimeType, size }
  const [fileInputKey, setFileInputKey] = useState(0);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const bottomRef = useRef(null);

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ block: "end" });
  }, [posts.length]);

  const handleFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > MAX_BOARD_FILE_BYTES) {
      setError("파일은 3.5MB 이하만 첨부할 수 있어.");
      return;
    }
    setError("");
    const reader = new FileReader();
    reader.onload = () => {
      setPendingFile({ dataUrl: reader.result, name: file.name, mimeType: file.type, size: file.size });
    };
    reader.readAsDataURL(file);
  };

  const send = async () => {
    if (!text.trim() && !pendingFile) return;
    setSending(true);
    const ok = await onPost(text, pendingFile);
    setSending(false);
    if (ok) {
      setText("");
      setPendingFile(null);
      setFileInputKey((k) => k + 1);
      setError("");
    } else {
      setError("전송에 실패했어. 다시 시도해줘.");
    }
  };

  const formatTime = (ts) => {
    const d = new Date(ts);
    return `${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };

  return (
    <SectionCard title="게시판" subtitle={loading ? "불러오는 중..." : `전체 ${posts.length}개 · 반 전체 공유`}>
      <button style={{ ...ghostBtnStyle, marginBottom: 10 }} onClick={onReload} disabled={loading}>새로고침</button>

      <div style={{
        maxHeight: 420, overflowY: "auto", display: "flex", flexDirection: "column", gap: 10,
        padding: "10px 4px", border: "1px solid var(--grid)", borderRadius: 8, marginBottom: 12, background: "#FBFCFE",
      }}>
        {posts.length === 0 && <EmptyHint text="아직 글이 없어. 첫 글을 남겨봐." />}
        {posts.map((p) => {
          const mine = p.studentId === myStudentId;
          return (
            <div key={p.id} style={{ display: "flex", flexDirection: "column", alignItems: mine ? "flex-end" : "flex-start" }}>
              <span style={{ fontSize: 11, color: "var(--ink-soft)", marginBottom: 2 }}>
                {p.name} · {formatTime(p.createdAt)}
              </span>
              <div style={{
                maxWidth: "80%", background: mine ? "var(--marker)" : "#EEF1F6", color: "var(--ink)",
                borderRadius: 12, padding: "8px 12px", fontSize: 13, wordBreak: "break-word",
              }}>
                {p.text && <p style={{ margin: p.attachment ? "0 0 6px" : 0, whiteSpace: "pre-wrap" }}>{p.text}</p>}
                {p.attachment && p.attachment.kind === "image" && (
                  <img src={p.attachment.dataUrl} alt={p.attachment.name} style={{ maxWidth: "100%", maxHeight: 220, borderRadius: 8, display: "block" }} />
                )}
                {p.attachment && p.attachment.kind === "file" && (
                  <a href={p.attachment.dataUrl} download={p.attachment.name} style={{ fontSize: 12, color: "#2E5FAE", textDecoration: "underline" }}>
                    📎 {p.attachment.name}
                  </a>
                )}
              </div>
            </div>
          );
        })}
        <div ref={bottomRef} />
      </div>

      {pendingFile && (
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, fontSize: 12, color: "var(--ink-soft)" }}>
          <span>첨부: {pendingFile.name}</span>
          <button style={xBtnStyle} onClick={() => setPendingFile(null)} aria-label="첨부 취소">✕</button>
        </div>
      )}
      {error && <p style={errorTextStyle}>{error}</p>}

      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <label style={{ ...ghostBtnStyle, display: "flex", alignItems: "center", cursor: "pointer" }}>
          📎 첨부
          <input key={fileInputKey} type="file" onChange={handleFileChange} style={{ display: "none" }} />
        </label>
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
          placeholder="메시지를 입력해줘"
          style={{ ...inputStyle, flex: 1 }}
        />
        <button style={primaryBtnStyle} onClick={send} disabled={sending || (!text.trim() && !pendingFile)}>
          {sending ? "전송 중..." : "전송"}
        </button>
      </div>
    </SectionCard>
  );
}

function MyPageTab({ profile, subjects, exam, onLogout, canOpenAdminView, onOpenAdminView }) {
  const [cur, setCur] = useState("");
  const [next1, setNext1] = useState("");
  const [next2, setNext2] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState("");
  const [busy, setBusy] = useState(false);

  const totalTopics = subjects.reduce((a, s) => a + s.topics.length, 0);
  const doneTopics = subjects.reduce((a, s) => a + s.topics.filter((t) => t.status === "달성").length, 0);
  const rate = totalTopics ? Math.round((doneTopics / totalTopics) * 100) : 0;

  const changePassword = async () => {
    setError(""); setSuccess("");
    if (!cur || !next1 || !next2) {
      setError("모든 칸을 입력해줘.");
      return;
    }
    if (next1.length < 4) {
      setError("새 비밀번호는 4자 이상으로 입력해줘.");
      return;
    }
    if (next1 !== next2) {
      setError("새 비밀번호가 서로 달라.");
      return;
    }
    setBusy(true);
    try {
      const r = await window.storage.get(`account:${profile.studentId}`, true);
      const account = r ? JSON.parse(r.value) : null;
      if (!account || account.password !== cur) {
        setError("현재 비밀번호가 틀렸어.");
      } else {
        const result = await window.storage.set(`account:${profile.studentId}`, JSON.stringify({ ...account, password: next1 }), true);
        if (!result) {
          setError("저장에 실패했어. 다시 시도해줘.");
        } else {

function PasswordResetPanel({ students, accounts, setAccounts, onReload, accountsLoading }) {
  const [resetDrafts, setResetDrafts] = useState({});
  const [rowBusy, setRowBusy] = useState({});
  const [rowMsg, setRowMsg] = useState({});

  const resetPassword = async (id) => {
    const draft = (resetDrafts[id] || "").trim();
    if (draft.length < 4) {
      setRowMsg({ ...rowMsg, [id]: { type: "error", text: "4자 이상 입력해줘." } });
      return;
    }
    setRowBusy({ ...rowBusy, [id]: true });
    try {
      const account = accounts[id];
      const result = await window.storage.set(`account:${id}`, JSON.stringify({ ...account, password: draft }), true);
      if (!result) {
        setRowMsg({ ...rowMsg, [id]: { type: "error", text: "초기화에 실패했어. 다시 시도해줘." } });
      } else {
        setAccounts({ ...accounts, [id]: { ...account, password: draft } });
        setRowMsg({ ...rowMsg, [id]: { type: "success", text: "비밀번호가 초기화됐어." } });
        setResetDrafts({ ...resetDrafts, [id]: "" });
      }
    } catch (e) {
      setRowMsg({ ...rowMsg, [id]: { type: "error", text: "초기화에 실패했어." } });
    }
    setRowBusy({ ...rowBusy, [id]: false });
  };

  return (
    <SectionCard title="학생 비밀번호 초기화" subtitle={accountsLoading ? "불러오는 중..." : "학번 순"}>
      <button style={{ ...ghostBtnStyle, marginBottom: 12 }} onClick={onReload} disabled={accountsLoading}>새로고침</button>
      {students.map(([id, name]) => {
        const account = accounts[id];
        const busy = !!rowBusy[id];
        const msg = rowMsg[id];
        if (!account) return null;
        return (
          <div key={id} style={adminRowStyle}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <div>
                <span style={{ fontWeight: 600, color: "var(--ink)", fontSize: 14 }}>{name}</span>
                <span style={{ fontSize: 12, color: "var(--ink-soft)", marginLeft: 8 }}>학번 {id}</span>
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap", alignItems: "center" }}>
              <input
                value={resetDrafts[id] || ""}
                onChange={(e) => setResetDrafts({ ...resetDrafts, [id]: e.target.value })}
                placeholder="새 비밀번호 (4자 이상)"
                style={{ ...inputStyle, width: 180, height: 32 }}
              />
              <button style={{ ...ghostBtnStyle, height: 32 }} onClick={() => resetPassword(id)} disabled={busy}>
                비밀번호 초기화
              </button>
            </div>
            {msg && (
              <p style={{ fontSize: 12, margin: "6px 0 0", color: msg.type === "error" ? "var(--coral)" : "var(--teal)" }}>
                {msg.text}
              </p>
            )}
          </div>
        );
      })}
      {students.filter(([id]) => accounts[id]).length === 0 && <EmptyHint text="등록된 학생이 없어." />}
    </SectionCard>
  );
}
