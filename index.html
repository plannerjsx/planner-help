function ActivityLogPanel({ students, allTasks, tasksLoading, onReload }) {
  const [mode, setMode] = useState("day"); // day | week
  const [dateKey, setDateKey] = useState(() => toKey(new Date()));
  const [expandedId, setExpandedId] = useState(null);
  const [showAbsent, setShowAbsent] = useState(false);
  const dateObj = new Date(dateKey + "T00:00:00");

  const weekdayIdx = (dateObj.getDay() + 6) % 7; // 0=월 ... 6=일
  const weekStart = addDays(dateObj, -weekdayIdx);
  const weekEnd = addDays(weekStart, 6);
  const weekKeys = Array.from({ length: 7 }, (_, i) => toKey(addDays(weekStart, i)));

  const dateLabel = `${dateObj.getFullYear()}.${pad2(dateObj.getMonth() + 1)}.${pad2(dateObj.getDate())} (${WEEKDAY_KO[weekdayIdx]})`;
  const weekLabel = `${weekStart.getMonth() + 1}.${weekStart.getDate()} ~ ${weekEnd.getMonth() + 1}.${weekEnd.getDate()}`;

  const keysForMode = mode === "day" ? [dateKey] : weekKeys;

  const rows = students.map(([id, name]) => {
    let list = [];
    keysForMode.forEach((k) => {
      const dayList = (allTasks[id] && allTasks[id][k]) || [];
      list = list.concat(dayList.map((t) => ({ ...t, _date: k })));
    });
    const counts = { 예정: 0, 중요: 0, 달성: 0, 보류: 0, 실패: 0 };
    list.forEach((t) => { const s = t.status || DEFAULT_TASK_STATUS; if (counts[s] != null) counts[s] += 1; });
    const total = list.length;

    if (mode === "week") {
      // 주간에서는 서버 시작일(SERVER_START_DATE) 이후 ~ 오늘까지의 요일만 기준으로 계산
      // (서버 시작 전 요일이나 아직 오지 않은 미래 요일은 "안 한 날"에 포함하지 않음)
      const todayKey = toKey(new Date());
      const validKeys = weekKeys.filter((k) => k >= SERVER_START_DATE && k <= todayKey);
      const activeDayFlags = validKeys.map((k) => ((allTasks[id] && allTasks[id][k]) || []).length > 0);
      const activeDays = activeDayFlags.filter(Boolean).length;
      const missedWeekdays = validKeys.map((k, i) => (!activeDayFlags[i] ? WEEKDAY_KO[weekKeys.indexOf(k)] : null)).filter(Boolean);
      const rate = validKeys.length ? Math.round((activeDays / validKeys.length) * 100) : 0;
      return { id, name, list, counts, total, rate, activeDays, totalValidDays: validKeys.length, missedWeekdays };
    }

    const rate = total ? Math.round((counts["달성"] / total) * 100) : 0;
    return { id, name, list, counts, total, rate, activeDays: total > 0 ? 1 : 0, totalValidDays: 1, missedWeekdays: [] };
  });

  const activeRows = rows.filter((r) => r.total > 0);
  const absentRows = rows.filter((r) => r.total === 0);
  const totalTasksAll = rows.reduce((a, r) => a + r.total, 0);
  const totalAchievedAll = rows.reduce((a, r) => a + r.counts["달성"], 0);
  const overallRate = mode === "week"
    ? (rows.length ? Math.round(rows.reduce((a, r) => a + r.rate, 0) / rows.length) : 0)
    : (totalTasksAll ? Math.round((totalAchievedAll / totalTasksAll) * 100) : 0);

  const toggleExpand = (id) => setExpandedId((cur) => (cur === id ? null : id));
  const switchMode = (m) => { setMode(m); setExpandedId(null); setShowAbsent(false); };
  const step = mode === "day" ? 1 : 7;
  const goPrev = () => { setExpandedId(null); setDateKey(toKey(addDays(dateObj, -step))); };
  const goNext = () => { setExpandedId(null); setDateKey(toKey(addDays(dateObj, step))); };
  const goToday = () => { setExpandedId(null); setDateKey(toKey(new Date())); };

  return (
    <SectionCard
      title="활동 로그"
      subtitle={tasksLoading ? "불러오는 중..." : `${mode === "day" ? dateLabel : weekLabel} · 반 전체 달성률 ${overallRate}%`}
    >
      <nav style={{ ...tabBarStyle, marginBottom: 14 }}>
        <button onClick={() => switchMode("day")} style={{ ...tabBtnStyle, ...(mode === "day" ? tabBtnActiveStyle : {}) }}>일별</button>
        <button onClick={() => switchMode("week")} style={{ ...tabBtnStyle, ...(mode === "week" ? tabBtnActiveStyle : {}) }}>주간</button>
      </nav>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", gap: 8 }}>
          <button style={ghostBtnStyle} onClick={goPrev}>‹ {mode === "day" ? "어제" : "지난주"}</button>
          <button style={ghostBtnStyle} onClick={goToday}>{mode === "day" ? "오늘" : "이번주"}</button>
          <button style={ghostBtnStyle} onClick={goNext}>{mode === "day" ? "내일" : "다음주"} ›</button>
          <button style={ghostBtnStyle} onClick={onReload} disabled={tasksLoading}>새로고침</button>
        </div>
        {mode === "day" && (
          <input
            type="date"
            value={dateKey}
            onChange={(e) => { if (e.target.value) { setExpandedId(null); setDateKey(e.target.value); } }}
            style={{ ...inputStyle, width: 150, height: 34 }}
          />
        )}
      </div>

      <div className="grid-row-mobile" style={gridRow}>
        <MetricCard label="반 전체 달성률" value={`${overallRate}%`} accent="var(--teal)" />
        <MetricCard label="활동 학생" value={`${activeRows.length} / ${students.length}명`} accent="var(--ink)" />
      </div>

      <button
        type="button"
        onClick={() => setShowAbsent((v) => !v)}
        style={{ ...ghostBtnStyle, width: "100%", marginBottom: 12, textAlign: "left", color: absentRows.length ? "var(--coral)" : "var(--ink-soft)" }}
      >
        {showAbsent ? "▾" : "▸"} 안 한 사람 {absentRows.length}명
      </button>
      {showAbsent && (
        <div style={{ marginBottom: 14 }}>
          {absentRows.length === 0 ? (
            <EmptyHint text="전원 활동했어." />
          ) : (
            <p style={{ fontSize: 13, color: "var(--coral)", lineHeight: 1.9, margin: 0 }}>
              {absentRows.map((r) => `${r.name}(${r.id})`).join(", ")}
            </p>
          )}
        </div>
      )}

      {activeRows.length === 0 ? (
        <EmptyHint text={mode === "day" ? "이 날짜에 등록된 할 일이 없어." : "이번 주 등록된 할 일이 없어."} />
      ) : (
        activeRows.map((r) => {
          const isOpen = expandedId === r.id;
          return (
            <div key={r.id} style={adminRowStyle}>
              <button
                type="button"
                onClick={() => toggleExpand(r.id)}
                style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap",
                  width: "100%", background: "transparent", border: "none", padding: 0, cursor: "pointer", textAlign: "left",
                }}
              >
                <div>
                  <span style={{ fontSize: 11, color: "var(--ink-soft)", marginRight: 6 }}>{isOpen ? "▾" : "▸"}</span>
                  <span style={{ fontWeight: 600, color: "var(--ink)", fontSize: 14 }}>{r.name}</span>
                  <span style={{ fontSize: 12, color: "var(--ink-soft)", marginLeft: 8 }}>학번 {r.id}</span>
                  {mode === "week" && r.missedWeekdays.length > 0 && (
                    <div style={{ fontSize: 11, color: "var(--coral)", marginTop: 2 }}>
                      안 한 요일: {r.missedWeekdays.join(", ")}
                    </div>
                  )}
                </div>
                <span style={{ fontSize: 12, fontWeight: 700, color: r.rate >= 70 ? "var(--teal)" : r.rate >= 40 ? "var(--ink)" : "var(--coral)" }}>
                  {mode === "week" ? `달성률 ${r.rate}% (${r.activeDays}/${r.totalValidDays}일)` : `달성률 ${r.rate}% · 총 ${r.total}개`}
                </span>
              </button>
              {isOpen && (
                <ul style={{ margin: "8px 0 0", padding: 0, listStyle: "none" }}>
                  {r.list.map((t) => {
                    const st = TASK_STATUS_MAP[t.status] || TASK_STATUS_MAP[DEFAULT_TASK_STATUS];
                    return (
                      <li key={`${t.id}-${t._date}`} style={ruledLine}>
                        <span style={{ color: "var(--ink)" }}>
                          {mode === "week" && <span style={{ fontSize: 11, color: "var(--ink-soft)", marginRight: 6 }}>{t._date.slice(5)}</span>}
                          {t.text}
                        </span>
                        <span style={{ fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 999, color: st.color, background: st.bg }}>
                          {st.key}
                        </span>
                      </li>
                    );
                  })}
                </ul>
              )}
            </div>
          );
        })
      )}
    </SectionCard>
  );
}

function GradeOverviewPanel({ students, accounts, accountsLoading, classScores, statsLoading, onReload }) {
  const [roundKey, setRoundKey] = useState(DEFAULT_ROUND_KEY);
  const [selectedId, setSelectedId] = useState(""); // "" = 전체 보기
  const round = EXAM_ROUNDS.find((r) => r.key === roundKey);

  const avgBySubject = round.subjects.map((subj) => {
    const values = students
      .map(([id]) => classScores[id]?.[roundKey]?.[subj]?.actual)
      .filter((v) => typeof v === "number");
    return values.length ? Math.round(values.reduce((a, b) => a + b, 0) / values.length) : null;
  });

  const selected = students.find(([id]) => id === selectedId);
  const selectedName = selected ? selected[1] : "";

  return (
    <SectionCard
      title="학생 정보 · 성적통계표"
      subtitle={accountsLoading || statsLoading ? "불러오는 중..." : "10816 전용 · 학생별 입력값 기준"}
    >
      <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap", alignItems: "center" }}>
        <button style={{ ...ghostBtnStyle }} onClick={onReload} disabled={accountsLoading || statsLoading}>새로고침</button>
        <select value={selectedId} onChange={(e) => setSelectedId(e.target.value)} style={{ ...inputStyle, width: 180, height: 34 }}>
          <option value="">전체 학생 보기</option>
          {students.map(([id, name]) => (
            <option key={id} value={id}>{name} ({id})</option>
          ))}
        </select>
      </div>

      <nav style={{ ...tabBarStyle, marginBottom: 14 }}>
        {EXAM_ROUNDS.map((r) => (
          <button key={r.key} onClick={() => setRoundKey(r.key)} style={{ ...tabBtnStyle, ...(roundKey === r.key ? tabBtnActiveStyle : {}) }}>
            {r.label}
          </button>
        ))}
      </nav>

      {!selectedId ? (
        <div style={{ overflowX: "auto" }}>
          <table style={overviewTableStyle}>
            <thead>
              <tr>
                <th style={overviewHeadCell}>학번</th>
                <th style={overviewHeadCell}>이름</th>
                <th style={overviewHeadCell}>등록</th>
                {round.subjects.map((s) => (
                  <th key={s} style={overviewHeadCell}>{s}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {students.map(([id, name]) => {
                const account = accounts[id];
                const roundScores = classScores[id]?.[roundKey] || {};
                return (
                  <tr key={id}>
                    <td style={overviewCell}>{id}</td>
                    <td style={{ ...overviewCell, fontWeight: 600, color: "var(--ink)" }}>{name}</td>
                    <td style={overviewCell}>
                      <span style={{
                        fontSize: 11, fontWeight: 600, padding: "2px 7px", borderRadius: 999,
                        background: account ? "#E1F5EE" : "#F1EFE8",
                        color: account ? "var(--teal)" : "var(--ink-soft)",
                      }}>
                        {account ? "완료" : "미등록"}
                      </span>
                    </td>
                    {round.subjects.map((s) => (
                      <td key={s} style={overviewCell}>{typeof roundScores[s]?.actual === "number" ? roundScores[s].actual : "-"}</td>
                    ))}
                  </tr>
                );
              })}
              <tr>
                <td style={overviewCell} colSpan={3}><strong>반 평균</strong></td>
                {avgBySubject.map((v, i) => (
                  <td key={round.subjects[i]} style={{ ...overviewCell, fontWeight: 700 }}>{v == null ? "-" : v}</td>
                ))}
              </tr>
            </tbody>
          </table>
        </div>
      ) : (
        <StudentGradeDetail name={selectedName} scores={classScores[selectedId] || {}} />
      )}
    </SectionCard>
  );
}

function StudentGradeDetail({ name, scores }) {
  return (
    <div>
      <p style={{ fontSize: 14, fontWeight: 700, color: "var(--ink)", margin: "0 0 12px" }}>{name}의 회차별 성적</p>
      {EXAM_ROUNDS.map((r) => {
        const roundScores = scores[r.key] || {};
        const hasAny = r.subjects.some((s) => typeof roundScores[s]?.actual === "number");
        return (
          <div key={r.key} style={{ marginBottom: 18 }}>
            <p style={{ fontSize: 13, fontWeight: 700, color: "var(--ink)", margin: "0 0 8px" }}>{r.label}</p>
            {!hasAny ? (
              <EmptyHint text="입력된 점수가 없어." />
            ) : (
              <ul style={{ margin: 0, padding: 0, listStyle: "none" }}>
                {r.subjects.map((s) => {
                  const entry = roundScores[s] || {};
                  const diff = typeof entry.actual === "number" && typeof entry.target === "number" ? entry.actual - entry.target : null;
                  return (
                    <li key={s} style={ruledLine}>
                      <span style={{ color: "var(--ink)" }}>{s}</span>
                      <span style={{ fontSize: 13, color: "var(--ink-soft)" }}>
                        {typeof entry.actual === "number" ? entry.actual : "-"}
                        {typeof entry.target === "number" && ` / 목표 ${entry.target}`}
                        {diff != null && (
                          <span style={{ marginLeft: 8, fontWeight: 700, color: diff >= 0 ? "var(--teal)" : "var(--coral)" }}>
                            {diff >= 0 ? `+${diff}` : diff}
                          </span>
                        )}
                      </span>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        );
      })}
    </div>
  );
}

function MetricCard({ label, value, accent }) {
  return (
    <div style={metricCardStyle}>
      <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "0 0 6px" }}>{label}</p>
      <p style={{ fontSize: 22, fontWeight: 800, color: accent, margin: 0 }}>{value}</p>
    </div>
  );
}

function ProgressBar({ pct }) {
  return (
    <div style={{ height: 8, background: "#E4E9F0", borderRadius: 4, overflow: "hidden" }}>
      <div style={{ width: `${pct}%`, height: "100%", background: pct === 100 ? "var(--teal)" : "var(--marker)", transition: "width .3s" }} />
    </div>
  );
}

function SectionCard({ title, subtitle, onRemove, children }) {
  return (
    <div style={sectionCardStyle}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
        <div>
          <h2 style={{ fontSize: 15, fontWeight: 800, color: "var(--ink)", margin: 0 }}>{title}</h2>
          {subtitle && <p style={{ fontSize: 12, color: "var(--ink-soft)", margin: "2px 0 0" }}>{subtitle}</p>}
        </div>
        {onRemove && <button style={xBtnStyle} onClick={onRemove} aria-label="과목 삭제">✕</button>}
      </div>
      {children}
    </div>
  );
}

function EmptyHint({ text }) {
  return <p style={{ fontSize: 13, color: "var(--ink-soft)", margin: 0, padding: "8px 0" }}>{text}</p>;
}

  return (
    <style>{`
      :root {
        --paper: #F4F6F9;
        --surface: #FFFFFF;
        --ink: #16213E;
        --ink-soft: #6B7690;
        --grid: #E1E6ED;
        --marker: #FFC145;

        --coral: #FF6259;
      }
      * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; }
      input[type=number]::-webkit-inner-spin-button { opacity: 1; }
      input:focus { outline: none; border-color: var(--ink) !important; }

      /* 핸드폰 모드 - 화면이 좁을 때 배열을 세로로 바꿔줌 */
      @media (max-width: 640px) {
        .app-header { flex-direction: column !important; align-items: flex-start !important; gap: 10px !important; }
        .grid-row-mobile { flex-direction: column !important; }
        .week-cols { flex-direction: column !important; min-width: 0 !important; }

        .quote-card-grid { grid-template-columns: repeat(2, 1fr) !important; }
        .quote-flip-card { height: 96px !important; }
      }
    `}</style>
  );
}
